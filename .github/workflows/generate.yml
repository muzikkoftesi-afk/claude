name: Video Üret

on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Konular (virgülle ayrılmış, boş bırakılırsa rastgele/kullanılmamış konular seçilir). audience=kids ise yok sayılır."
        required: false
        default: ""
      lang:
        description: "Seslendirme dili"
        required: true
        default: "tr"
        type: choice
        options: [tr, en]
      subtitle_lang:
        description: "Alt yazı dili"
        required: true
        default: "tr"
        type: choice
        options: [tr, en]
      audience:
        description: "Hedef kitle: general=genel Shorts/uzun içerik, kids=1-5 yaş çocuk bölümü (en az 10dk, otomatik uzun form)"
        required: true
        default: "general"
        type: choice
        options: [general, kids]
      video_type:
        description: "Video türü (audience=kids seçiliyse bu alan yok sayılır, bölüm otomatik uzun form olur)"
        required: true
        default: "short"
        type: choice
        options: [short, long]
      count:
        description: "Kaç video/bölüm üretilecek (aynı anda)"
        required: true
        default: "1"

permissions:
  contents: write   # üretilen konu geçmişini (config/used_history.json) repoya geri yazabilmek için

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bağımlılıkları (ffmpeg, libass, fontlar)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python bağımlılıkları
        run: pip install -r requirements.txt

      - name: Video(lar)ı üret
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m src.main \
            --topics "${{ github.event.inputs.topics }}" \
            --lang "${{ github.event.inputs.lang }}" \
            --subtitle-lang "${{ github.event.inputs.subtitle_lang }}" \
            --audience "${{ github.event.inputs.audience }}" \
            --video-type "${{ github.event.inputs.video_type }}" \
            --count "${{ github.event.inputs.count }}"

      - name: Videoları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: uretilen-videolar
          path: output/*.mp4
          retention-days: 14

      - name: Kullanılan konu geçmişini kaydet (tekrar üretimi önlemek için)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/used_history.json
          if git diff --cached --quiet; then
            echo "Geçmişte değişiklik yok, commit atlanıyor."
          else
            git commit -m "Konu geçmişi güncellendi [skip ci]"
            git push
          fi
